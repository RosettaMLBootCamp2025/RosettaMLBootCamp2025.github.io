<script>
(function() {
  'use strict';

  function normalisePath(path) {
    if (!path) return '/';
    const clean = path.split('#')[0].split('?')[0].toLowerCase();
    return clean.endsWith('/') ? clean + 'index.html' : clean;
  }

  document.addEventListener('DOMContentLoaded', function() {
    const path = normalisePath(window.location.pathname);
    const dayMatch = path.match(/\/(monday|tuesday|wednesday|thursday|capstone)\//);
    if (!dayMatch || /\/(monday|tuesday|wednesday|thursday|capstone)\/index\.html$/.test(path)) return;

    const day = dayMatch[1];
    const dayLabel = day.charAt(0).toUpperCase() + day.slice(1);
    const manifestLessons = window.BOOTCAMP_COURSE && Array.isArray(window.BOOTCAMP_COURSE.lessons)
      ? window.BOOTCAMP_COURSE.lessons
          .filter(item => {
            const itemDay = String(item.day || '').toLowerCase();
            return itemDay === day || (day === 'monday' && itemDay === 'prework');
          })
          .map(item => normalisePath('/' + String(item.path || item.href || '').replace(/^\/+/, '')))
      : [];

    let lessons = manifestLessons;
    if (!lessons.length) {
      lessons = Array.from(document.querySelectorAll('.sidebar a[href]'))
        .map(link => {
          try { return normalisePath(new URL(link.getAttribute('href'), window.location.href).pathname); }
          catch (error) { return null; }
        })
        .filter(candidate => candidate && candidate.includes('/' + day + '/'))
        .filter(candidate => !candidate.endsWith('/' + day + '/index.html'));
      lessons = lessons.filter((candidate, index) => lessons.indexOf(candidate) === index);
    }

    const currentIndex = lessons.findIndex(candidate => path === candidate || path.endsWith(candidate));
    if (currentIndex < 0) return;

    const title = document.querySelector('h1.title, .quarto-title h1');
    if (!title) return;
    const total = lessons.length;
    const percent = Math.round(((currentIndex + 1) / total) * 100);
    const noun = day === 'capstone' ? 'Target' : 'Lesson';

    const chip = document.createElement('div');
    chip.className = 'day-progress-chip';
    chip.setAttribute('role', 'status');
    chip.setAttribute('aria-label', dayLabel + ', ' + noun + ' ' + (currentIndex + 1) + ' of ' + total);

    const label = document.createElement('span');
    label.textContent = dayLabel + ' · ' + noun + ' ' + (currentIndex + 1) + ' of ' + total;
    const bar = document.createElement('span');
    bar.className = 'dpc-bar';
    bar.setAttribute('aria-hidden', 'true');
    const fill = document.createElement('span');
    fill.className = 'dpc-fill';
    fill.style.width = percent + '%';
    bar.appendChild(fill);
    chip.append(label, bar);
    title.insertAdjacentElement('afterend', chip);
  });
})();
</script>
