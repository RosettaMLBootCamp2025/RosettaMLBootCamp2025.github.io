version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "08:00"
      timezone: America/Los_Angeles
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "08:15"
      timezone: America/Los_Angeles
    groups:
      accessibility-tooling:
        patterns:
          - "*"
