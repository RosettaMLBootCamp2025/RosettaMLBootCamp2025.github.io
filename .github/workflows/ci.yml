name: Validate site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Render Quarto site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      - name: Render site
        run: quarto render

  accessibility:
    name: Accessibility smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install accessibility tooling
        run: npm ci

      - name: Install browser for accessibility testing
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Render site
        run: quarto render

      - name: Check representative pages against WCAG 2.1 AA
        run: |
          python3 -m http.server 8000 --directory _site >"${RUNNER_TEMP}/quarto-site.log" 2>&1 &
          site_server_pid=$!
          trap 'kill "$site_server_pid" 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent --show-error http://127.0.0.1:8000/ >/dev/null
          npm run test:accessibility
